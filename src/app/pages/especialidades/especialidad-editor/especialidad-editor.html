<div class="max-w-7xl mx-auto w-full px-6 py-10" *ngIf="especialidad">

<div class="grid grid-cols-12 gap-8">

<!-- FORMULARIO -->
<div class="col-span-12 lg:col-span-8">

<h1 class="text-3xl font-black mb-2">
{{especialidad.titulo}}
</h1>

<p class="text-slate-500 mb-6">
Editar información de la especialidad
</p>

<div class="space-y-6">

<!-- NOMBRE -->
<div>
<label class="text-sm font-semibold">Nombre</label>
<input
[(ngModel)]="especialidad.titulo"
class="w-full h-12 px-4 rounded-lg border"
/>
</div>

<!-- DESCRIPCIÓN -->
<div>
<label class="text-sm font-semibold">Descripción</label>
<textarea
[(ngModel)]="especialidad.descripcion"
class="w-full p-4 rounded-lg border">
</textarea>
</div>

</div>

</div>

<!-- SIDEBAR -->
<div class="col-span-12 lg:col-span-4">

<div class="bg-white dark:bg-slate-900 border rounded-xl p-6">

<h4 class="font-bold mb-4">Acciones</h4>

<button
(click)="guardar()"
class="w-full bg-primary text-white h-12 rounded-lg mb-3">
Guardar
</button>

<button
(click)="eliminar()"
class="w-full border h-12 rounded-lg">
Eliminar
</button>

</div>

</div>

</div>

</div>
