<div class="p-8 max-w-4xl mx-auto w-full space-y-6">

  <!-- PAGE HEADER -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-slate-800 dark:text-white">Header del sitio</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Logo, navegación y botón de acción del header público.</p>
    </div>
    <button type="button" (click)="guardar()"
      [class]="guardado
        ? 'flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-semibold bg-green-500 text-white transition'
        : 'flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-semibold bg-primary text-white hover:bg-primary/90 transition shadow-md shadow-primary/20'">
      @if (guardado) {
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Guardado
      } @else {
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar cambios
      }
    </button>
  </div>

  <!-- LOGO -->
  <div class="bg-white dark:bg-background-dark border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-4">
    <h2 class="text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Logo e identidad</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">URL del logo</label>
        <input [(ngModel)]="config.logoUrl" (ngModelChange)="onChange()" placeholder="https://... (dejar vacío para usar texto)" class="input-field" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Nombre / siglas</label>
        <input [(ngModel)]="config.logoTexto" (ngModelChange)="onChange()" class="input-field" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Tagline (texto bajo el logo)</label>
        <input [(ngModel)]="config.tagline" (ngModelChange)="onChange()" class="input-field" />
      </div>
    </div>
  </div>

  <!-- NAVEGACIÓN -->
  <div class="bg-white dark:bg-background-dark border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Menú de navegación</h2>
      <button type="button" (click)="agregarLink()" class="text-xs text-primary hover:underline flex items-center gap-1">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Agregar enlace
      </button>
    </div>
    <div class="space-y-2">
      @for (link of config.navLinks; track trackById($index, link)) {
      <div class="flex items-center gap-2">
        <!-- Drag handle visual -->
        <svg class="w-4 h-4 text-slate-300 dark:text-slate-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="18" x2="16" y2="18"/></svg>
        <input [(ngModel)]="link.label" (ngModelChange)="onChange()" placeholder="Etiqueta" class="flex-1 input-field" />
        <input [(ngModel)]="link.url"   (ngModelChange)="onChange()" placeholder="URL" class="flex-1 input-field" />
        <button type="button" (click)="eliminarLink(link.id)" class="text-slate-300 dark:text-slate-600 hover:text-red-500 transition shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
      }
      @if (!config.navLinks.length) {
        <p class="text-sm text-slate-400 italic text-center py-4">Sin enlaces — agrega uno arriba.</p>
      }
    </div>
  </div>

  <!-- BOTÓN CTA -->
  <div class="bg-white dark:bg-background-dark border border-slate-200 dark:border-slate-800 rounded-2xl p-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">Botón de acción (CTA)</h2>
      <label class="flex items-center gap-2 cursor-pointer">
        <span class="text-xs text-slate-500 dark:text-slate-400">Mostrar botón</span>
        <div class="relative">
          <input type="checkbox" [(ngModel)]="config.mostrarCta" (ngModelChange)="onChange()" class="sr-only peer" />
          <div class="w-9 h-5 bg-slate-200 dark:bg-slate-700 rounded-full peer peer-checked:bg-primary transition"></div>
          <div class="absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition peer-checked:translate-x-4"></div>
        </div>
      </label>
    </div>
    @if (config.mostrarCta) {
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Texto del botón</label>
        <input [(ngModel)]="config.ctaLabel" (ngModelChange)="onChange()" class="input-field" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">URL del botón</label>
        <input [(ngModel)]="config.ctaUrl" (ngModelChange)="onChange()" class="input-field" />
      </div>
    </div>
    }
  </div>

</div>
